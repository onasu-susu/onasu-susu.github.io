<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>塾のファイル</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <style>
    main { max-width: 760px; margin: 0 auto; padding: 48px 16px 80px; }
    h1 { margin: 0 0 24px; font-size: 1.8rem; font-weight: 900; }
    .lock { display: flex; flex-wrap: wrap; gap: 10px; }
    .lock[hidden] { display: none; }
    .lock input {
      flex: 1; min-width: 0;
      padding: 10px 16px;
      border: 2px solid var(--line); border-radius: 999px;
      background: var(--surface); color: var(--text);
      font: inherit;
    }
    .lock input:focus { outline: none; border-color: var(--accent); }
    .lock button {
      padding: 10px 24px; border: 0; border-radius: 999px;
      background: var(--accent); color: #fff;
      font: inherit; font-weight: 700; cursor: pointer;
    }
    .lock button:disabled { opacity: 0.6; cursor: wait; }
    .files { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .files li {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }
    .files .name {
      flex: 1; min-width: 0; padding: 0; border: 0; background: none; color: inherit;
      font: inherit; font-weight: 700; text-align: left; cursor: pointer; overflow-wrap: anywhere;
    }
    .files .name:hover { color: var(--accent); }
    .files .size { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
    .files .dl {
      padding: 4px 12px; border: 0; border-radius: 999px;
      background: var(--accent); color: #fff;
      font: inherit; font-size: 0.85rem; font-weight: 700; white-space: nowrap; cursor: pointer;
    }
    .status { color: var(--muted); }
    .sort { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-bottom: 12px; color: var(--muted); font-size: 0.9rem; }
    .sort[hidden] { display: none; }
    .sort select {
      padding: 4px 10px; border: 2px solid var(--line); border-radius: 999px;
      background: var(--surface); color: var(--text); font: inherit;
    }
    .files .meta { color: var(--muted); font-size: 0.8rem; white-space: nowrap; text-align: right; line-height: 1.4; }
    .back { display: inline-block; margin-bottom: 20px; color: var(--accent); font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../">← トップへ戻る</a>
    <h1>塾のファイル</h1>
    <form class="lock">
      <input type="password" placeholder="パスワード" aria-label="パスワード" autocomplete="off" required>
      <button>ひらく</button>
    </form>
    <p class="status" hidden></p>
    <label class="sort" hidden>
      並べ替え
      <select>
        <option value="name">名前（昇順）</option>
        <option value="name-desc">名前（降順）</option>
        <option value="old">追加日（昇順）</option>
        <option value="new">追加日（降順）</option>
      </select>
    </label>
    <ul class="files"></ul>
  </main>

  <script>
    // ファイルは juku.py で暗号化して data/ に置いてある。
    // パスワードから鍵を作り、一覧（vault.json）とファイルをブラウザの中で元に戻す。
    const form = document.querySelector(".lock");
    const input = form.querySelector("input");
    const button = form.querySelector("button");
    const list = document.querySelector(".files");
    const status = document.querySelector(".status");
    let key;

    const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    const fresh = (path) => fetch(path + "?t=" + Date.now(), { cache: "no-store" });

    function say(text) {
      status.textContent = text;
      status.hidden = !text;
    }

    function size(n) {
      if (n < 1024) return n + " B";
      if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
      return (n / 1024 / 1024).toFixed(1) + " MB";
    }

    async function deriveKey(password, salt, iterations) {
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", hash: "SHA-256", salt, iterations },
        base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
      );
    }

    const decrypt = (iv, data) => crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);

    async function getFile(f) {
      const res = await fresh("data/" + f.id + ".bin");
      if (!res.ok) throw new Error(res.status);
      const buf = new Uint8Array(await res.arrayBuffer());
      const plain = await decrypt(buf.slice(0, 12), buf.slice(12));
      const type = /\.pdf$/i.test(f.name) ? "application/pdf" : "application/octet-stream";
      return URL.createObjectURL(new Blob([plain], { type }));
    }

    async function openFile(f) {
      // ポップアップブロックされないよう、先に新しいタブを開いておく
      const tab = window.open("", "_blank");
      try {
        const url = await getFile(f);
        if (tab) tab.location = url;
        else saveFile(f, url);
      } catch {
        if (tab) tab.close();
        say("ファイルを開けませんでした。少し時間をおいて、もう一度ためしてください。");
      }
    }

    async function saveFile(f, url) {
      try {
        const a = document.createElement("a");
        a.href = url || (await getFile(f));
        a.download = f.name;
        document.body.append(a);
        a.click();
        a.remove();
      } catch {
        say("ファイルを保存できませんでした。少し時間をおいて、もう一度ためしてください。");
      }
    }

    const sortBox = document.querySelector(".sort");
    const sortSelect = sortBox.querySelector("select");
    const byName = (a, b) => a.name.localeCompare(b.name, "ja", { numeric: true });
    const sorters = {
      name: byName,
      "name-desc": (a, b) => byName(b, a),
      // 追加日が同じときは名前順
      new: (a, b) => b.added.localeCompare(a.added) || byName(a, b),
      old: (a, b) => a.added.localeCompare(b.added) || byName(a, b),
    };
    let allFiles = [];

    function day(added) {
      const [y, m, d] = added.slice(0, 10).split("-");
      return `${y}/${Number(m)}/${Number(d)}`;
    }

    function show(files) {
      form.hidden = true;
      if (files.length === 0) {
        say("まだファイルはありません。");
        return;
      }
      say("");
      allFiles = files;
      sortBox.hidden = false;
      render();
    }

    sortSelect.addEventListener("change", render);

    function render() {
      list.replaceChildren();
      [...allFiles]
        .sort(sorters[sortSelect.value])
        .forEach((f) => {
          const li = document.createElement("li");

          const name = document.createElement("button");
          name.className = "name";
          name.textContent = f.name;
          name.addEventListener("click", () => openFile(f));

          const s = document.createElement("span");
          s.className = "meta";
          s.append(day(f.added), document.createElement("br"), size(f.size));

          const dl = document.createElement("button");
          dl.className = "dl";
          dl.textContent = "ダウンロード";
          dl.addEventListener("click", () => saveFile(f));

          li.append(name, s, dl);
          list.append(li);
        });
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      button.disabled = true;
      say("確認しています…");
      try {
        const res = await fresh("data/vault.json");
        if (res.status === 404) {
          say("まだファイルはありません。");
          return;
        }
        if (!res.ok) throw new Error(res.status);
        const vault = await res.json();
        key = await deriveKey(input.value, bytes(vault.salt), vault.iterations);
        let files;
        try {
          files = JSON.parse(new TextDecoder().decode(await decrypt(bytes(vault.iv), bytes(vault.data))));
        } catch {
          say("パスワードがちがいます。");
          input.select();
          return;
        }
        input.value = "";
        show(files);
      } catch {
        say("読み込めませんでした。少し時間をおいて、もう一度ためしてください。");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
