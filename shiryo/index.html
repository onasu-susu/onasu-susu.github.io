<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>資料</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <style>
    main { max-width: 760px; margin: 0 auto; padding: 48px 16px 80px; }
    h1 { margin: 0 0 24px; font-size: 1.8rem; font-weight: 900; }
    .lock { display: flex; flex-wrap: wrap; gap: 10px; }
    .lock[hidden] { display: none; }
    .lock input {
      flex: 1; min-width: 0;
      padding: 10px 16px;
      border: 2px solid var(--line); border-radius: 999px;
      background: var(--surface); color: var(--text);
      font: inherit;
    }
    .lock input:focus { outline: none; border-color: var(--accent); }
    .lock button {
      padding: 10px 24px; border: 0; border-radius: 999px;
      background: var(--accent); color: #fff;
      font: inherit; font-weight: 700; cursor: pointer;
    }
    .lock button:disabled { opacity: 0.6; cursor: wait; }
    .files { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .files li {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }
    .files .name {
      flex: 1; min-width: 0; padding: 0; border: 0; background: none; color: inherit;
      font: inherit; font-weight: 700; text-align: left; cursor: pointer; overflow-wrap: anywhere;
    }
    .files .name:hover { color: var(--accent); }
    .files .size { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
    .files .dl {
      padding: 4px 12px; border: 0; border-radius: 999px;
      background: var(--accent); color: #fff;
      font: inherit; font-size: 0.85rem; font-weight: 700; white-space: nowrap; cursor: pointer;
    }
    .status { color: var(--muted); }
    .sort { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-bottom: 12px; color: var(--muted); font-size: 0.9rem; }
    .sort[hidden] { display: none; }
    .sort select {
      padding: 4px 10px; border: 2px solid var(--line); border-radius: 999px;
      background: var(--surface); color: var(--text); font: inherit;
    }
    .files .meta { color: var(--muted); font-size: 0.8rem; white-space: nowrap; text-align: right; line-height: 1.4; }
    .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: -8px 0 16px; font-weight: 700; }
    .crumbs[hidden] { display: none; }
    .crumbs button { padding: 0; border: 0; background: none; color: var(--accent); font: inherit; cursor: pointer; }
    .crumbs span { color: var(--muted); }
    .crumbs b { color: var(--text); }
    .files .folder { cursor: pointer; }
    .files .folder:hover { border-color: var(--accent); }
    .files .icon { font-size: 1.4rem; line-height: 1; }
    .files .open { color: var(--accent); font-size: 1.3rem; font-weight: 900; }
    .top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .top-row .back { margin-bottom: 0; }
    .logout {
      padding: 4px 14px; border: 2px solid var(--line); border-radius: 999px;
      background: var(--surface); color: var(--muted);
      font: inherit; font-size: 0.85rem; font-weight: 700; cursor: pointer;
    }
    .logout:hover { border-color: var(--accent); color: var(--accent); }
    .logout[hidden] { display: none; }
    .back { display: inline-block; margin-bottom: 20px; color: var(--accent); font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="top-row">
      <a class="back" href="../">← トップへ戻る</a>
      <button class="logout" type="button" hidden>🔒 ロックする</button>
    </div>
    <h1>資料</h1>
    <nav class="crumbs" aria-label="いまいるフォルダ" hidden></nav>
    <form class="lock">
      <input type="password" placeholder="パスワード" aria-label="パスワード" autocomplete="off" required>
      <button>ひらく</button>
    </form>
    <p class="status" hidden></p>
    <label class="sort" hidden>
      並べ替え
      <select>
        <option value="name">名前（昇順）</option>
        <option value="name-desc">名前（降順）</option>
        <option value="old">追加日（昇順）</option>
        <option value="new">追加日（降順）</option>
      </select>
    </label>
    <ul class="files"></ul>
  </main>

  <script>
    // リロードしたら、ページのいちばん上から表示する（開いていたフォルダはそのまま。下の show を参照）
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    if (location.hash) history.replaceState(null, "", location.pathname + location.search); // 前の「#フォルダ名」の形のアドレスで開いたとき
    window.scrollTo(0, 0);

    // ファイルは shiryo.py で暗号化して data/ に置いてある。
    // パスワードから鍵を作り、一覧（vault.json）とファイルをブラウザの中で元に戻す。
    const form = document.querySelector(".lock");
    const input = form.querySelector("input");
    const button = form.querySelector("button");
    const list = document.querySelector(".files");
    const status = document.querySelector(".status");
    let key;

    const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    const fresh = (path) => fetch(path + "?t=" + Date.now(), { cache: "no-store" });

    function say(text) {
      status.textContent = text;
      status.hidden = !text;
    }

    function size(n) {
      if (n < 1024) return n + " B";
      if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
      return (n / 1024 / 1024).toFixed(1) + " MB";
    }

    async function deriveKey(password, salt, iterations) {
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", hash: "SHA-256", salt, iterations },
        base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]
      );
    }

    const decrypt = (iv, data) => crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);

    async function getFile(f) {
      const res = await fresh("data/" + f.id + ".bin");
      if (!res.ok) throw new Error(res.status);
      const buf = new Uint8Array(await res.arrayBuffer());
      const plain = await decrypt(buf.slice(0, 12), buf.slice(12));
      const type = /\.pdf$/i.test(f.name) ? "application/pdf" : "application/octet-stream";
      return URL.createObjectURL(new Blob([plain], { type }));
    }

    async function openFile(f) {
      // ポップアップブロックされないよう、先に新しいタブを開いておく
      const tab = window.open("", "_blank");
      try {
        const url = await getFile(f);
        if (tab) tab.location = url;
        else saveFile(f, url);
      } catch {
        if (tab) tab.close();
        say("ファイルを開けませんでした。少し時間をおいて、もう一度ためしてください。");
      }
    }

    async function saveFile(f, url) {
      try {
        const a = document.createElement("a");
        a.href = url || (await getFile(f));
        a.download = f.name;
        document.body.append(a);
        a.click();
        a.remove();
      } catch {
        say("ファイルを保存できませんでした。少し時間をおいて、もう一度ためしてください。");
      }
    }

    const sortBox = document.querySelector(".sort");
    const sortSelect = sortBox.querySelector("select");
    const byName = (a, b) => a.name.localeCompare(b.name, "ja", { numeric: true });
    const sorters = {
      name: byName,
      "name-desc": (a, b) => byName(b, a),
      // 追加日が同じときは名前順
      new: (a, b) => b.added.localeCompare(a.added) || byName(a, b),
      old: (a, b) => a.added.localeCompare(b.added) || byName(a, b),
    };
    let allFiles = [];

    function day(added) {
      const [y, m, d] = added.slice(0, 10).split("-");
      return `${y}/${Number(m)}/${Number(d)}`;
    }

    // いま見ているフォルダ（"" がいちばん上。「塾用/大和大学過去問」のように / で区切る）
    let folders = [];
    let current = "";
    const crumbs = document.querySelector(".crumbs");
    const parentOf = (d) => (d.includes("/") ? d.slice(0, d.lastIndexOf("/")) : "");
    const baseName = (d) => d.slice(d.lastIndexOf("/") + 1);
    // いちばん上のフォルダは、この順番で並べる（ほかは名前順）
    const ORDER = ["塾用", "講義関連", "その他"];
    const rank = (d) => (ORDER.includes(d) ? ORDER.indexOf(d) : ORDER.length);
    const inside = (d) => allFiles.filter((f) => f.folder === d || f.folder.startsWith(d + "/")).length;

    function show(box) {
      form.hidden = true;
      // フォルダができる前の古い形（ファイルの一覧だけ）にも対応する
      if (Array.isArray(box)) box = { folders: [], files: box };
      allFiles = box.files.map((f) => ({ folder: "", ...f }));
      folders = [...new Set(box.folders || [])];
      // ファイルが入っているフォルダは、一覧になくても表示する
      allFiles.forEach((f) => {
        const parts = f.folder ? f.folder.split("/") : [];
        parts.forEach((_, i) => folders.push(parts.slice(0, i + 1).join("/")));
      });
      folders = [...new Set(folders)];
      if (allFiles.length === 0 && folders.length === 0) {
        say("まだファイルはありません。");
        return;
      }
      say("");
      sortBox.hidden = false;
      // リロードしたときは、開いていたフォルダのまま（ブラウザが覚えている history.state から）
      // はじめて開いたときは「資料」のいちばん上から
      current = (history.state && history.state.folder) || "";
      if (!folders.includes(current)) current = "";
      render();
    }

    sortSelect.addEventListener("change", render);

    function go(folder) {
      current = folder;
      // アドレスは変えずに、ブラウザの「戻る」用にフォルダだけ覚えておく
      history.pushState({ folder }, "", location.pathname + location.search);
      render();
      window.scrollTo({ top: 0 });
    }

    window.addEventListener("popstate", (e) => {
      if (!form.hidden) return; // まだパスワードを入れていない
      current = (e.state && e.state.folder) || "";
      if (!folders.includes(current)) current = "";
      render();
      window.scrollTo({ top: 0 });
    });

    function renderCrumbs() {
      crumbs.replaceChildren();
      crumbs.hidden = !current; // いちばん上では見出しと同じなので出さない
      const parts = current ? current.split("/") : [];
      const top = document.createElement(parts.length ? "button" : "b");
      top.textContent = "資料";
      if (parts.length) top.addEventListener("click", () => go(""));
      crumbs.append(top);
      parts.forEach((p, i) => {
        const sep = document.createElement("span");
        sep.textContent = "›";
        const path = parts.slice(0, i + 1).join("/");
        const el = document.createElement(i === parts.length - 1 ? "b" : "button");
        el.textContent = p;
        if (i < parts.length - 1) el.addEventListener("click", () => go(path));
        crumbs.append(sep, el);
      });
    }

    function render() {
      renderCrumbs();
      list.replaceChildren();

      // フォルダ（名前順）
      folders
        .filter((d) => parentOf(d) === current)
        .sort((a, b) => rank(a) - rank(b) || a.localeCompare(b, "ja", { numeric: true }))
        .forEach((d) => {
          const li = document.createElement("li");
          li.className = "folder";
          li.tabIndex = 0;
          const icon = document.createElement("span");
          icon.className = "icon";
          icon.textContent = "📁";
          const name = document.createElement("span");
          name.className = "name";
          name.textContent = baseName(d);
          const s = document.createElement("span");
          s.className = "meta";
          const n = inside(d);
          s.textContent = n ? n + " 件" : "空";
          const open = document.createElement("span");
          open.className = "open";
          open.textContent = "›";
          li.append(icon, name, s, open);
          li.addEventListener("click", () => go(d));
          li.addEventListener("keydown", (e) => { if (e.key === "Enter") go(d); });
          list.append(li);
        });

      // ファイル（並べ替えの指定どおり）
      const here = allFiles.filter((f) => f.folder === current);
      [...here]
        .sort(sorters[sortSelect.value])
        .forEach((f) => {
          const li = document.createElement("li");

          const name = document.createElement("button");
          name.className = "name";
          name.textContent = f.name;
          name.addEventListener("click", () => openFile(f));

          const s = document.createElement("span");
          s.className = "meta";
          s.append(day(f.added), document.createElement("br"), size(f.size));

          const dl = document.createElement("button");
          dl.className = "dl";
          dl.textContent = "ダウンロード";
          dl.addEventListener("click", () => saveFile(f));

          li.append(name, s, dl);
          list.append(li);
        });

      if (!list.children.length) say("このフォルダは空です。");
      else say("");
    }

    // ひらいた鍵を、このタブのあいだだけ覚えておく（sessionStorage は、タブやブラウザを閉じると消える）
    // → リロードしてもパスワードを入れ直さなくてよい。共用の PC では「ロックする」かタブを閉じれば元どおり
    const SAVED = "shiryo-key";
    const logout = document.querySelector(".logout");

    function forget() {
      try { sessionStorage.removeItem(SAVED); } catch {}
    }

    async function remember(salt) {
      try {
        const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
        sessionStorage.setItem(SAVED, JSON.stringify({ salt, key: btoa(String.fromCharCode(...raw)) }));
      } catch {}
    }

    async function loadVault() {
      const res = await fresh("data/vault.json");
      if (res.status === 404) return null;
      if (!res.ok) throw new Error(res.status);
      return res.json();
    }

    async function openVault(vault) {
      return JSON.parse(new TextDecoder().decode(await decrypt(bytes(vault.iv), bytes(vault.data))));
    }

    function unlocked(files) {
      logout.hidden = false;
      show(files);
    }

    logout.addEventListener("click", () => {
      forget();
      location.reload();
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      button.disabled = true;
      say("確認しています…");
      try {
        const vault = await loadVault();
        if (!vault) {
          say("まだファイルはありません。");
          return;
        }
        key = await deriveKey(input.value, bytes(vault.salt), vault.iterations);
        let files;
        try {
          files = await openVault(vault);
        } catch {
          say("パスワードがちがいます。");
          input.select();
          return;
        }
        input.value = "";
        await remember(vault.salt);
        unlocked(files);
      } catch {
        say("読み込めませんでした。少し時間をおいて、もう一度ためしてください。");
      } finally {
        button.disabled = false;
      }
    });

    // このタブで一度ひらいていれば、パスワードなしでそのまま開く
    (async () => {
      let saved;
      try { saved = JSON.parse(sessionStorage.getItem(SAVED) || "null"); } catch {}
      if (!saved) return;
      form.hidden = true;
      say("ひらいています…");
      try {
        const vault = await loadVault();
        // パスワードが変わっていたら（salt がちがえば）使えないので、入れ直してもらう
        if (!vault || vault.salt !== saved.salt) throw new Error("changed");
        key = await crypto.subtle.importKey("raw", bytes(saved.key), "AES-GCM", true, ["decrypt"]);
        unlocked(await openVault(vault));
      } catch {
        forget();
        key = undefined;
        form.hidden = false;
        say("");
      }
    })();
  </script>
</body>
</html>
